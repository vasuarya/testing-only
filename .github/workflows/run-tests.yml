name: Run Tests using github actions
on:
    push

jobs:
    my-test-job:
        runs-on:
            ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                node-version: '20.14.0'
            - name: Install dependencies
              run: npm install
            - name: Run tests
              run: npm run test